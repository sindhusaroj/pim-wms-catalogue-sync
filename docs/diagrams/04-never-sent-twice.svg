(0, 0, 0) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel" style="color:#000 !important"><p>I1 - never twice within one run<br />SKU appears in two batches</p></span></div></foreignObject></g></g><g transform="translate(485.5, 96)" id="flowchart-I2-1" class="node default q"><rect height="126" width="260" y="-63" x="-130" style="fill:#e3f2fd !important;stroke:#1565c0 !important" class="basic label-container"/><g transform="translate(-100, -48)" style="color:#000 !important" class="label"><rect/><foreignObject height="96" width="200"><div xmlns="http://www.w3.org/1999/xhtml" style="color: rgb(0, 0, 0) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel" style="color:#000 !important"><p>I2 - never twice across runs<br />unchanged products resent</p></span></div></foreignObject></g></g><g transform="translate(795.5, 96)" id="flowchart-I3-2" class="node default q"><rect height="102" width="256.421875" y="-51" x="-128.2109375" style="fill:#e3f2fd !important;stroke:#1565c0 !important" class="basic label-container"/><g transform="translate(-98.2109375, -36)" style="color:#000 !important" class="label"><rect/><foreignObject height="72" width="196.421875"><div xmlns="http://www.w3.org/1999/xhtml" style="color: rgb(0, 0, 0) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel" style="color:#000 !important"><p>I3 - never APPLIED twice<br />duplicate delivery is fine<br />if the WMS deduplicates</p></span></div></foreignObject></g></g><g transform="translate(1154.21875, 96)" id="flowchart-I4-3" class="node default q"><rect height="102" width="252.21875" y="-51" x="-126.109375" style="fill:#e3f2fd !important;stroke:#1565c0 !important" class="basic label-container"/><g transform="translate(-96.109375, -36)" style="color:#000 !important" class="label"><rect/><foreignObject height="72" width="192.21875"><div xmlns="http://www.w3.org/1999/xhtml" style="color: rgb(0, 0, 0) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel" style="color:#000 !important"><p>I4 - never twice after an<br />AMBIGUOUS outcome<br />timeout or reset</p></span></div></foreignObject></g></g><g transform="translate(175.5, 334)" id="flowchart-B1-4" class="node default ok"><rect height="126" width="260" y="-63" x="-130" style="fill:#e8f5e9 !important;stroke:#2e7d32 !important" class="basic label-container"/><g transform="translate(-100, -48)" style="color:#000 !important" class="label"><rect/><foreignObject height="96" width="200"><div xmlns="http://www.w3.org/1999/xhtml" style="color: rgb(0, 0, 0) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel" style="color:#000 !important"><p>dedupe on id in AssembleExport,<br />one SKU per batch per run</p></span></div></foreignObject></g></g><g transform="translate(485.5, 334)" id="flowchart-B2-5" class="node default ok"><rect height="126" width="260" y="-63" x="-130" style="fill:#e8f5e9 !important;stroke:#2e7d32 !important" class="basic label-container"/><g transform="translate(-100, -48)" style="color:#000 !important" class="label"><rect/><foreignObject height="96" width="200"><div xmlns="http://www.w3.org/1999/xhtml" style="color: rgb(0, 0, 0) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel" style="color:#000 !important"><p>sha256 content hash per SKU,<br />only changed products queued</p></span></div></foreignObject></g></g><g transform="translate(795.5, 334)" id="flowchart-B3-6" class="node default ok"><rect height="150" width="260" y="-75" x="-130" style="fill:#e8f5e9 !importa